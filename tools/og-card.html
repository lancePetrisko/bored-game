<!doctype html>
<!--
  Source for public/og.png — the link-preview card. Regenerate after changing it:

  "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" \
    --headless --disable-gpu --hide-scrollbars --force-device-scale-factor=1 \
    --window-size=1200,630 --screenshot=public/og.png tools/og-card.html
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        position: relative;
        background: #07080d;
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
        color: #e8f6ff;
      }
      .grid {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(hsl(195 45% 60% / 0.11) 1px, transparent 1px),
          linear-gradient(90deg, hsl(195 45% 60% / 0.11) 1px, transparent 1px);
        background-size: 64px 64px;
      }
      .glow {
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at 50% 52%, hsl(195 80% 50% / 0.22), transparent 62%);
      }
      .stack {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 26px;
      }
      .cube {
        width: 76px;
        height: 76px;
        border-radius: 20px;
        background: hsl(195 90% 64%);
        box-shadow: 0 0 60px hsl(195 100% 60% / 0.9);
        display: grid;
        place-items: center;
      }
      .cube i {
        width: 34px;
        height: 34px;
        border-radius: 10px;
        background: hsl(195 100% 94% / 0.9);
      }
      h1 {
        font-size: 92px;
        font-weight: 800;
        letter-spacing: -2px;
        text-shadow: 0 0 44px hsl(195 100% 60% / 0.65);
      }
      p {
        font-size: 26px;
        font-weight: 600;
        color: hsl(220 25% 80% / 0.72);
      }
      .kicker {
        font-size: 22px;
        font-weight: 800;
        letter-spacing: 4px;
        color: hsl(195 90% 76% / 0.9);
        margin-bottom: 10px;
      }
      .arrows {
        display: flex;
        gap: 22px;
        margin-top: 6px;
      }
      .arrows span {
        width: 68px;
        height: 68px;
        display: grid;
        place-items: center;
        font-size: 34px;
        font-weight: 700;
        border-radius: 16px;
        color: hsl(195 80% 82%);
        border: 2px solid hsl(195 70% 60% / 0.35);
        background: hsl(195 70% 50% / 0.08);
      }
      .foot {
        position: absolute;
        bottom: 42px;
        width: 100%;
        text-align: center;
        font-size: 20px;
        font-weight: 700;
        color: hsl(195 60% 78% / 0.55);
        letter-spacing: 3px;
      }
    </style>
  </head>
  <body>
    <div class="grid"></div>
    <div class="glow"></div>
    <div class="stack">
      <div class="cube"><i></i></div>
      <h1>BORED CUBE</h1>
      <div class="kicker">ULTIME STIM GAME</div>
      <p>a cube, a grid, and nothing to win</p>
      <div class="arrows"><span>→</span><span>↑</span><span>←</span><span>↓</span></div>
    </div>
    <div class="foot">21 HIDDEN COMBOS</div>
  </body>
</html>
